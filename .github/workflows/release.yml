name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes in this Release
          
          Please refer to the commit log for detailed changes.
          
          ## Installation
          
          ### Docker
          ```bash
          docker pull latency-monitor:${{ github.ref }}
          docker run -p 8000:8000 latency-monitor:${{ github.ref }}
          ```
          
          ### Local
          ```bash
          python3 -m application.dashboard
          ```
        draft: false
        prerelease: false

  notify:
    runs-on: ubuntu-latest
    needs: release
    
    steps:
    - name: Notify Release (Optional)
      run: |
        echo "Release ${{ github.ref }} created successfully"
